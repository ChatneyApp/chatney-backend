description: |
  # Chatney backend

  Architecture and data-model views derived from the .NET runtime, FluentMigrator
  migrations, and the TLA+/Alloy specifications.

resources:
- name: Users
  id: users_actor
  subtitle: Web and desktop chat clients
  style: plural
  color: RoyalBlue

- name: Operator
  id: operator
  subtitle: Installation and administration
  color: SlateBlue

- name: Chatney Backend
  id: backend
  subtitle: .NET 9 monolith
  color: DarkSlateBlue
  children:
  - name: Authentication Middleware
    id: auth_middleware
    subtitle: JWT validation and current-user loading
    color: MediumSlateBlue

  - name: GraphQL API
    id: graphql
    subtitle: HotChocolate queries and mutations
    color: MediumSlateBlue

  - name: Domain Resolvers
    id: domains
    subtitle: Users, roles, workspaces, channels, and messages
    color: MediumSlateBlue
    children:
    - name: User Domain
      id: user_domain
    - name: Role Domain
      id: role_domain
    - name: Organization Domain
      id: organization_domain
    - name: Message Domain
      id: message_domain
    - name: Attachment Domain
      id: attachment_domain
    - name: Configuration Domain
      id: config_domain

  - name: Role Manager
    id: role_manager
    subtitle: Scoped permission resolution
    color: MediumSlateBlue

  - name: Message Hydrator
    id: message_hydrator
    subtitle: Batch-loads related message data
    color: MediumSlateBlue

  - name: Repository Hub
    id: app_repos
    subtitle: AppRepos and generic PgRepo
    color: MediumSlateBlue

  - name: WebSocket Connector
    id: websocket
    subtitle: In-memory event fan-out
    color: MediumSlateBlue

- name: PostgreSQL
  id: postgres
  subtitle: Primary relational state
  color: DarkGreen
  children:
  - name: Roles
    id: roles_table
    subtitle: permissions[] and protection flag
  - name: Users
    id: users_table
    subtitle: Global role and account flags
  - name: User Roles
    id: user_roles_table
    subtitle: Scoped role plus allow and deny lists
  - name: Workspaces
    id: workspaces_table
  - name: Channel Types
    id: channel_types_table
    subtitle: Logical base-role reference
  - name: Channels
    id: channels_table
    subtitle: Logical workspace and type references
  - name: Channel Groups
    id: channel_groups_table
    subtitle: Ordered channel_ids array
  - name: Messages
    id: messages_table
    subtitle: Threads, replies, and attachment references
  - name: Message Reactions
    id: reactions_table
  - name: Draft Messages
    id: drafts_table
  - name: Attachments
    id: attachments_table
  - name: URL Previews
    id: previews_table
  - name: Configurations
    id: configs_table

- name: Object Storage
  id: object_storage
  subtitle: S3-compatible attachment blobs
  color: DarkGreen

- name: Connected Clients
  id: connected_clients
  subtitle: WebSocket consumers
  style: plural
  color: RoyalBlue

- name: Kafka
  id: kafka
  subtitle: Provisioned locally but not wired into runtime
  style: dashed
  color: DimGray

- name: Formal Models
  id: formal_models
  subtitle: Design-time verification only
  color: DarkGoldenrod
  children:
  - name: TLA+ State Machine
    id: tla
    subtitle: Transitions, permissions, events, and invariants
  - name: Alloy Relational Model
    id: alloy
    subtitle: Schema, indexes, cascades, and transitions
  - name: Core Safety
    id: core_safety
    subtitle: Properties expected to hold
  - name: Known Gaps
    id: known_gaps
    subtitle: Properties intentionally outside CoreSafety

- name: Authorization Inputs
  id: authorization_inputs
  subtitle: Actor plus target resource
  color: DarkOrange
  children:
  - name: Channel Override
    id: channel_override
  - name: Channel Type Override
    id: channel_type_override
  - name: Workspace Override
    id: workspace_override
  - name: Global Role
    id: global_role
  - name: Effective Permissions
    id: effective_permissions
    subtitle: role ∪ allowlist − denylist
  - name: Mutation Guard
    id: mutation_guard
    subtitle: Can or Require

perspectives:
- name: System Context
  color: RoyalBlue
  orientation: leftToRight
  notes: |
    Chatney is one deployable .NET monolith. GraphQL is the implemented HTTP API.
    PostgreSQL stores application state; S3-compatible storage holds attachment
    blobs. Kafka is present in local Compose but has no runtime integration.
  relations:
  - from: users_actor
    to: backend
    label: GraphQL over HTTP
  - from: users_actor
    to: websocket
    label: WebSocket connection
  - from: operator
    to: graphql
    label: Install and administer
  - from: backend
    to: postgres
    label: SQL
  - from: attachment_domain
    to: object_storage
    label: Store blobs
  - from: kafka
    label: Not integrated
    secondary: true
  overrides:
  - resourceId: backend
    detail: contracted
  - resourceId: postgres
    detail: contracted

- name: Runtime Components
  color: SlateBlue
  orientation: leftToRight
  notes: |
    Resolvers coordinate authorization, repositories, hydration, and real-time
    notifications directly. There is no separate application-service layer.
  relations:
  - from: users_actor
    to: graphql
    via: auth_middleware
    label: Authenticated request
  - from: graphql
    to: domains
    label: Dispatch operation
  - from: domains
    to: role_manager
    label: Require permission
  - from: domains
    to: app_repos
    label: Read and write
  - from: app_repos
    to: postgres
    label: RepoDb and Npgsql
  - from: message_domain
    to: message_hydrator
    label: Shape response
  - from: message_hydrator
    to: app_repos
    label: Batch related rows
  - from: domains
    to: websocket
    label: Emit mutation event
  - from: websocket
    to: connected_clients
    label: Broadcast or target user
  - from: attachment_domain
    to: object_storage
    label: Put object
  overrides:
  - resourceId: backend
    detail: expanded
  - resourceId: domains
    detail: expanded
  - resourceId: postgres
    detail: contracted

- name: Authenticated Message Mutation
  color: MediumSlateBlue
  notes: |
    Representative dynamic path for adding or editing a message. Database writes
    precede WebSocket notification, and the response is hydrated from related rows.
  sequence:
    start: users_actor
    steps:
    - toAndBack: auth_middleware
      label: Validate JWT and load user
    - to: graphql
      label: Execute message mutation
    - to: message_domain
      label: Dispatch resolver
    - toAndBack: role_manager
      label: Resolve scope and require permission
    - toAndBack: app_repos
      label: Persist message
    - toAsync: websocket
      label: Emit mutation event
    - restartAt: websocket
    - toAsync: connected_clients
      label: Push update
    - restartAt: message_domain
    - to: message_hydrator
      label: Hydrate response
    - toAndBack: app_repos
      label: Batch users, attachments, previews, and reactions
    - to: graphql
      label: Return message view
    - to: users_actor
      label: GraphQL response

- name: Domain Data Model
  color: DarkGreen
  orientation: topToBottom
  notes: |
    This view follows current migrations and runtime models. Solid relations are
    declared foreign keys. Relations labeled "logical" are IDs or arrays without
    database foreign-key enforcement.
  relations:
  - from: users_table
    to: roles_table
    label: global role
  - from: user_roles_table
    to: users_table
    label: scoped user
  - from: user_roles_table
    to: roles_table
    label: scoped role
  - from: user_roles_table
    to: workspaces_table
    label: optional scope
  - from: user_roles_table
    to: channel_types_table
    label: optional scope
  - from: user_roles_table
    to: channels_table
    label: optional scope
  - from: channel_types_table
    to: roles_table
    label: logical base role
  - from: channels_table
    to: workspaces_table
    label: logical workspace
  - from: channels_table
    to: channel_types_table
    label: logical type
  - from: channel_groups_table
    to: workspaces_table
    label: workspace
  - from: channel_groups_table
    to: channels_table
    label: logical channel_ids[]
  - from: messages_table
    to: users_table
    label: author
  - from: messages_table
    to: channels_table
    label: channel
  - from: messages_table
    to: messages_table
    label: parent and reply
  - from: messages_table
    to: attachments_table
    label: logical attachment_ids[]
  - from: messages_table
    to: previews_table
    label: logical url_preview_ids[]
  - from: reactions_table
    to: messages_table
    label: message
  - from: reactions_table
    to: users_table
    label: actor
  - from: drafts_table
    to: users_table
    label: owner
  - from: drafts_table
    to: channels_table
    label: channel
  - from: drafts_table
    to: drafts_table
    label: parent
  - from: attachments_table
    to: users_table
    label: owner
  overrides:
  - resourceId: postgres
    parentId: none
    detail: expanded

- name: Permission Resolution
  color: DarkOrange
  notes: |
    Scope precedence is channel, channel type, workspace, then global role.
    At a matching override, effective permissions are the role permissions plus
    allowlist entries minus denylist entries. AllMighty bypasses normal checks.
  sequence:
    start: authorization_inputs
    steps:
    - to: channel_override
      label: Find matching user-role row
    - to: channel_type_override
      label: If no channel row
    - to: workspace_override
      label: If no channel-type row
    - to: global_role
      label: If no workspace row
    - to: effective_permissions
      label: Expand role, allow, and deny
    - to: mutation_guard
      label: Require requested permission
    - to: domains
      label: Continue only when allowed

- name: Formal Assurance
  color: DarkGoldenrod
  orientation: leftToRight
  notes: |
    TLA+ and Alloy are design-time verification models, not production controls.
    Core safety covers declared referential integrity, uniqueness, authorization,
    event correspondence, and install idempotence. Explicit gaps include exact
    thread counts, attachment ownership, and stronger domain references.
  relations:
  - from: domains
    to: tla
    label: behavior mirrored by
  - from: websocket
    to: tla
    label: event audits modeled by
  - from: postgres
    to: alloy
    label: schema modeled by
  - from: tla
    to: core_safety
    label: model-checks
  - from: tla
    to: known_gaps
    label: documents
  - from: alloy
    to: core_safety
    label: checks relational structure
  - from: alloy
    to: known_gaps
    label: exposes missing constraints

- name: Storage and Integrity Risks
  color: Firebrick
  orientation: leftToRight
  notes: |
    This risk-focused perspective highlights where runtime assumptions exceed
    database enforcement. It is intentionally narrower than the full data model.
  relations:
  - from: user_roles_table
    to: role_manager
    label: first matching row wins
  - from: channel_types_table
    to: roles_table
    label: baseRoleId has no FK
  - from: channels_table
    to: workspaces_table
    label: workspaceId has no FK
  - from: channels_table
    to: channel_types_table
    label: channelTypeId has no FK
  - from: messages_table
    to: attachments_table
    label: ownership not constrained
  - from: messages_table
    to: messages_table
    label: childrenCount can drift
  - from: websocket
    to: connected_clients
    label: userId query parameter identity
